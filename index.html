<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OVERCLOCKED</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#04060e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OVERCLOCKED">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060e;--text:#d8f6ff;--cyan:#00f0ff;--mag:#ff2bd6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--text);background:var(--bg);
  font-family:"Orbitron","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#sa{position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
.shake{animation:sh .25s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,6,14,.78);padding:16px}
#card{width:min(100%,460px);padding:28px 20px;text-align:center;background:rgba(8,14,30,.95);border:1px solid var(--cyan);
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));
  display:flex;flex-direction:column;gap:16px;align-items:center;box-shadow:0 0 30px rgba(0,240,255,.25) inset}
#title{font-size:clamp(28px,9vw,44px);font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 0 12px var(--cyan),3px 0 var(--mag)}
#sub{font-size:14px;line-height:1.8;color:#9bc4d4;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
.lv{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.lv button{flex:1 1 calc(50% - 4px);font:inherit;font-weight:700;font-size:14px;padding:12px 0;border:1px solid #2a5566;background:transparent;color:#7fb4c6;letter-spacing:.08em}
.lv button.on{border-color:var(--cyan);color:#001015;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
#start{width:100%;font:inherit;font-weight:900;font-size:20px;letter-spacing:.2em;padding:16px;border:1px solid var(--mag);color:#fff;
  background:linear-gradient(90deg,rgba(255,43,214,.25),rgba(0,240,255,.25));box-shadow:0 0 18px rgba(255,43,214,.5)}
#start:active{background:var(--mag)}

.scr{position:absolute;inset:0;z-index:3;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);background:#000}
.w{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
#t2{font-size:clamp(28px,9vw,44px);font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 0 12px var(--cyan),3px 0 var(--mag);margin-top:8px}
.pt{font-size:30px;font-weight:900;color:#f5ff3b;text-shadow:0 0 12px #f5ff3b}
.dim{font-size:12px;color:#7fb4c6;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
.b{width:100%;font:inherit;font-weight:900;font-size:18px;letter-spacing:.14em;padding:16px;border:1px solid var(--cyan);color:#fff;background:linear-gradient(90deg,rgba(0,240,255,.2),rgba(255,43,214,.2))}
.b:active{background:var(--mag)}.b:disabled{opacity:.35}
.b.s{font-size:14px;padding:12px;border-color:#2a5566;color:#9bc4d4;background:transparent}
.r2{display:flex;gap:8px;width:100%}.r2 .b{font-size:15px;padding:14px 4px;letter-spacing:.04em}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;width:100%}
.c{border:1px solid;padding:10px 4px;font-size:11px;line-height:1.4;background:rgba(8,14,30,.95);animation:pop .4s both;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;position:relative}
.c b{display:block;font-family:inherit;font-size:13px}.c .s{font-size:30px;margin:4px 0}.c.no{opacity:.22}
.c i{position:absolute;top:2px;right:4px;font-style:normal;font-size:10px;color:#fff}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.b2{width:100%;font:inherit;font-size:13px;padding:10px;border:1px solid #2a5566;background:transparent;color:#7fb4c6;letter-spacing:.1em}
.c .im{aspect-ratio:3/4;position:relative;background:#0a1428;overflow:hidden;margin-bottom:4px}
.c .im span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.35}
.c .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c i{z-index:2;text-shadow:0 0 4px #000}.c.SSR{box-shadow:0 0 14px #f5ff3b}.c.SR{box-shadow:0 0 10px #ff2bd6}
.c.big{width:min(68vw,300px);font-size:16px;padding:10px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 0 40px currentColor}
.c.big b{font-size:22px}
#fx{position:absolute;inset:0;z-index:10;background:#04060e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#fcard{position:relative;z-index:2}
#fskip{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:auto;padding:8px 14px}
.scr.bg{background:linear-gradient(to top,rgba(4,6,14,.85) 0,rgba(4,6,14,0) 45%),url(title.jpg) center/cover no-repeat,#04060e}
.w.m{min-height:100%;justify-content:space-between}
.tp,.bt{width:100%;display:flex;flex-direction:column;gap:10px;align-items:center}.bt{gap:12px}
.scr.bg .b{background:rgba(4,6,14,.72)}.scr.bg .pt,.scr.bg .dim{text-shadow:0 0 6px #000,0 0 12px #000}.scr.bg .dim{color:#d8f6ff}
#t2.logo{font-size:clamp(30px,8vw,64px);white-space:nowrap;margin:0 0 6px;text-shadow:0 0 18px var(--cyan),0 0 40px var(--cyan),4px 0 var(--mag)}
.w.m{max-width:720px}.bt{max-width:460px}
.zoomable{cursor:pointer}
#zoom{position:absolute;inset:0;z-index:12;background:rgba(4,6,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.c.big.zm{width:min(88vw,calc(68vh*.75),480px);font-size:18px;animation:pop .35s both;box-shadow:0 0 30px currentColor}
.zw{margin:auto;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:10px}
#zoom{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 24px}
.c.big.zm{width:min(62vw,calc(38vh*.75),300px)}
.st{display:flex;align-items:center;gap:8px;width:100%;font-size:13px;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
.st span{width:54px;text-align:left}.st b{width:62px;text-align:right}
.bar{flex:1;height:8px;background:rgba(0,240,255,.15)}.bar i{display:block;height:100%}
.ta{width:100%;height:84px;background:#0a1428;color:#d8f6ff;border:1px solid #2a5566;font-size:12px;padding:8px;user-select:text;-webkit-user-select:text;resize:none}
.warn{font-size:12px;line-height:1.7;color:#ffb3c0;border:1px solid #ff3b5c;padding:10px;text-align:left;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
.msg{color:#f5ff3b;font-size:13px;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
.c.UL{box-shadow:0 0 18px #fff,0 0 34px #ff2bd6}
.ulb{text-align:center;font-weight:900;font-size:20px;letter-spacing:.12em;margin-bottom:10px;background:linear-gradient(90deg,#ff2bd6,#f5ff3b,#39ff88,#00f0ff,#ff2bd6);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 1.5s linear infinite}
@keyframes rb{to{background-position:200% 0}}
.gi{display:block;width:100%;max-height:36vh;object-fit:contain}
#title.tfc{background:linear-gradient(90deg,#ff2bd6,#f5ff3b,#39ff88,#00f0ff,#ff2bd6);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:rb 1.2s linear infinite,pop .6s cubic-bezier(.2,1.6,.4,1) both;font-size:clamp(24px,7.5vw,38px)}
#title.tcl{color:#f5ff3b;text-shadow:0 0 18px #f5ff3b;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.jp{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
.atile,.pc{border:1px solid;background:rgba(8,14,30,.95);padding:5px;font-size:10px;line-height:1.35;position:relative;text-align:center}
.atile .im,.pc .im{aspect-ratio:3/4;position:relative;background:#0a1428;overflow:hidden;margin-bottom:3px}
.atile .im span,.pc .im span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.35}
.atile .im img,.pc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.atile.on{outline:2px solid #f5ff3b;box-shadow:0 0 12px #f5ff3b}.atile .as{color:#9bc4d4;margin-top:3px}
.atile i{position:absolute;top:2px;right:5px;font-style:normal;font-size:15px;color:#f5ff3b;font-weight:900;text-shadow:0 0 4px #000;z-index:2}
.slots{display:flex;gap:6px;width:100%}.slot{flex:1;height:46px;border:1px dashed #2a5566;display:flex;align-items:center;justify-content:center;color:#2a5566;font-size:11px;padding:2px;line-height:1.2}
.ens{display:flex;gap:8px;justify-content:center;width:100%}
.en{flex:1;max-width:130px;text-align:center;border:1px solid transparent;padding:6px 2px;font-size:11px;cursor:pointer}
.en.tg{border-color:#ff2bd6;box-shadow:0 0 12px #ff2bd6}.en.dead{opacity:.18}.en .sy{font-size:50px;line-height:1.1}
.hb{height:6px;background:rgba(255,255,255,.12);margin-top:3px}.hb i{display:block;height:100%;background:#39ff88}
.pcs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.pc.dead{opacity:.25}.pc.cur{outline:2px solid #f5ff3b;box-shadow:0 0 12px #f5ff3b}.pc .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log{width:100%;min-height:96px;background:rgba(0,0,0,.6);border:1px solid #2a5566;padding:8px;text-align:left;font-size:12px;line-height:1.6}
.cmd{display:flex;gap:8px;width:100%}.cmd .b{font-size:15px;padding:14px 4px;letter-spacing:.04em}
.en.hit,.pc.hit{animation:sh .2s}
.en .mi{aspect-ratio:1/1;position:relative;background:#0a1428;overflow:hidden;margin-bottom:4px;border:1px solid currentColor}
.en .mi span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;opacity:.4}
.en .mi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.log{height:112px;overflow:hidden}
.cn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:46px;height:46px;padding:0;font-size:22px;border:1px solid var(--cyan);background:rgba(4,6,14,.72);color:#fff;z-index:5;box-shadow:0 0 10px rgba(0,240,255,.4)}
.cn i{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--mag);font:700 11px/18px sans-serif;font-style:normal}
.ac{width:100%;border:1px solid #2a5566;padding:10px;text-align:left;font-size:13px;line-height:1.6;background:rgba(8,14,30,.95)}.ac.d{border-color:#f5ff3b}.ac.g{opacity:.45}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="sa"></div>
<div id="overlay" hidden><div id="card">
  <div id="title">OVERCLOCKED</div>
  <div id="sub">シンプルな音ゲーです。<br>ノーツが下のラインに重なる瞬間に、そのレーンをタップ。<br>複数の指で同時に押せます。（PC: Z X C V B）<br>スコア × 難易度倍率 ＝ ガチャPT</div>
  <div class="lv" id="lv">
    <button data-l="easy">EASY</button><button data-l="normal" class="on">NORMAL</button><button data-l="hard">HARD</button><button data-l="veryhard">VERY HARD</button>
  </div>
  <button id="start">START</button>
  <button class="b2" id="toHome">HOME</button>
</div></div>

<div class="scr" id="home"></div>
<div id="zoom" hidden></div>
<div id="fx" hidden><canvas id="fc"></canvas><div id="fcard"></div><button class="b2" id="fskip">SKIP</button></div>

<script>
(() => {
  const LANES = [
    {sym:"▲", color:"#00f0ff"},
    {sym:"◆", color:"#ff2bd6"},
    {sym:"●", color:"#f5ff3b"},
    {sym:"■", color:"#39ff88"},
    {sym:"✚", color:"#9d6bff"},
  ];
  // irr: 拍の間隔に掛ける倍率をランダムに選ぶ（不規則な譜面になる）／chord: 同時押しノーツの出現率
  const MAX_HP = 10;   // 全難易度共通
  const LEVELS = {
    easy:   {name:"EASY", keys:3, bpm:160, fall:1500, goal:150,  irr:[1],                                  chord:0},
    normal: {name:"NORMAL", keys:4, bpm:180, fall:1200, goal:300, irr:[1, 1, 0.5, 1.5, 0.75],              chord:0},
    hard:   {name:"HARD", keys:5, bpm:220, fall:600,  goal:650, irr:[0.5, 0.5, 0.75, 1, 0.5, 1.5, 0.6, 2, 0.5], chord:0},
    veryhard: {name:"VERY HARD", keys:5, bpm:220, fall:600,  goal:650, irr:[0.5, 0.5, 0.75, 1, 0.5, 1.5, 0.6, 2, 0.5], chord:0.15},
  };
  // index.html と同じフォルダに置く。ゲーム開始のたびにランダムで1曲選ばれる
  const BGM_FILES = Array.from({length: 15}, (_, k) => "Music" + (k + 1) + ".mp3");
  const PERFECT = 70, GOOD = 150, NEAR = 340;
  const FONT = '"Orbitron","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
  const KEYS_PC = "zxcvb";
  const params = new URLSearchParams(location.search);
  let level = LEVELS[params.get("level")] ? params.get("level") : "normal";

  let KEYS, GOAL, BPM, FALL, INTERVAL, T0, USE, BASE_GOAL, IRR, CHORD;
  function setLevel(l){
    level = l; const P = LEVELS[l];
    KEYS = P.keys; BASE_GOAL = GOAL = P.goal; BPM = P.bpm; FALL = P.fall; IRR = P.irr; CHORD = P.chord;
    INTERVAL = 60000 / BPM; T0 = FALL + 600; USE = LANES.slice(0, KEYS);
  }
  setLevel(level);

  // BGM（ゲーム開始と同時に再生。効果音・振動はなし）
  const bgm = new Audio();
  bgm.preload = "auto"; bgm.volume = 0.85; bgm.loop = true;
  const BGM_HARD = ["music-h-01.mp3", "music-h-02.mp3", "music-h-03.mp3"];   // HARD / VERY HARD 専用（通常曲に加えて選ばれる）
  let lastBgm = "";
  function pickBgm(){
    const pool = EV ? BATTLE_BGM : (level === "hard" || level === "veryhard") ? BGM_FILES.concat(BGM_HARD) : BGM_FILES;   // イベントバトル中は battle1〜3.mp3
    let f;
    do { f = pool[Math.floor(Math.random() * pool.length)]; } while (f === lastBgm && pool.length > 1);
    lastBgm = f; return f;
  }

  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d", {alpha:false}), ov = $("overlay");
  const title = $("title"), sub = $("sub"), startBtn = $("start"), lvBox = $("lv"), sa = $("sa");
  const markLevel = () => [...lvBox.children].forEach(b => b.classList.toggle("on", b.dataset.l === level));
  markLevel();
  [...lvBox.children].forEach(b => { const q = LEVELS[b.dataset.l]; b.innerHTML = q.name + '<br><span style="font-size:11px;opacity:.8">GOAL ' + q.goal + '</span>'; });
  lvBox.addEventListener("click", e => { const l = e.target.dataset && e.target.dataset.l; if (l){ setLevel(l); notes = []; layout(); markLevel(); } });

  let state = "idle"; let EV = null;
  let hp = 0, score = 0, combo = 0, maxCombo = 0, resolved = 0, spawned = 0, cnt = {p:0, g:0, m:0};
  let notes = [], startT = 0, lastLane = -1, sameRun = 0, nextT = 0;
  const flashes = [];
  let judge = {text:"", color:"#fff", at:0};
  let shakeAt = -1e9;   // ミス時の画面揺れ（canvas内で描画。CSSでcanvasごと動かすと端が黒く見えて点滅する）
  let L = {};

  function layout(){
    const dpr = window.devicePixelRatio || 1;
    const W = window.innerWidth, H = window.innerHeight;
    const nw = Math.round(W * dpr), nh = Math.round(H * dpr);
    if (cv.width !== nw || cv.height !== nh){ cv.width = nw; cv.height = nh; }   // 同じサイズなら再設定しない（再設定すると一瞬真っ黒になる）
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cs = getComputedStyle(sa);
    const st = parseFloat(cs.paddingTop) || 0, sb = parseFloat(cs.paddingBottom) || 0;
    const fieldW = Math.min(W, 520);
    const topY = st + 70;
    const padH = Math.max(110, Math.min(170, H * 0.2));
    const bottom = H - sb - 8;
    L = {W, H, fieldW, fx:(W - fieldW) / 2, laneW:fieldW / KEYS, topY, bottom, judgeY:bottom - padH, st};
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", () => setTimeout(layout, 200));
  layout();

  const setJudge = (text, color) => { judge = {text, color, at:performance.now()}; };

  function begin(){
    layout();
    hp = MAX_HP; score = 0; combo = 0; maxCombo = 0; resolved = 0; spawned = 0; notes = [];
    cnt = {p:0, g:0, m:0}; lastLane = -1; sameRun = 0; GOAL = BASE_GOAL; nextT = T0;
    judge = {text:"", color:"#fff", at:0};
    try { bgm.pause(); bgm.src = pickBgm(); bgm.currentTime = 0; bgm.play().catch(() => {}); } catch(e){}   // タップ操作内で再生
    ov.hidden = true; ov.style.background = ""; title.className = ""; fw.length = 0;
    startT = performance.now();
    state = "play";
  }

  function finish(cleared){
    state = "over";
    try { bgm.pause(); } catch(e){}
    S.st.pl++; if (cleared){ S.st.ok++; if (cnt.m === 0) S.st.fc++; } S.st.mc = Math.max(S.st.mc, maxCombo); save();
    if (EV) return evFinish(cleared);
    const fcb = cleared && cnt.m === 0;
    title.textContent = fcb ? "FULL COMBO!" : cleared ? "CLEAR" : "GAME OVER";
    title.className = fcb ? "tfc" : cleared ? "tcl" : "";
    sub.innerHTML = "HIT " + score + " / " + GOAL + "<br>PERFECT " + cnt.p + " ・ GOOD " + cnt.g + " ・ MISS " + cnt.m + "<br>MAX COMBO " + maxCombo;
    const base = cnt.p * PT_P + cnt.g * PT_G, cb = cleared ? base * CLEAR_RATE : 0, fb = fcb ? base * FC_RATE : 0;
    const rw = Math.round((base + cb + fb) * MULT[level]);
    S.pt += rw; S.best = Math.max(S.best, score); save();
    sub.innerHTML += '<br>' + (fcb ? '<b style="color:#f5ff3b">★ FULL COMBO ★</b><br>' : '') +
      'BASE ' + Math.round(base) + (cb ? ' ＋ CLEAR ' + Math.round(cb) : '') + (fb ? ' ＋ FULL COMBO ' + Math.round(fb) : '') + ' ×' + MULT[level] +
      '<br><b style="color:#f5ff3b;font-size:20px">+' + rw + ' PT</b>（所持 ' + S.pt + '）';
    startBtn.textContent = "RETRY";
    lvBox.hidden = false;
    ov.hidden = false;
    if (cleared){ ov.style.background = "rgba(4,6,14,.5)"; celebrate(fcb); fcb ? sfxFC() : sfxClear(); } else sfxLose();
  }

  // クリア演出：紙吹雪（フルコンボは増量＋花火）
  const fw = [];
  function celebrate(big){
    const cols = ["#00f0ff", "#ff2bd6", "#f5ff3b", "#39ff88", "#9d6bff"];
    for (let k = 0; k < (big ? 150 : 70); k++) fw.push({x:Math.random() * L.W, y:-10 - Math.random() * L.H * .3, vx:(Math.random() - .5) * 2, vy:2 + Math.random() * 3, g:.02, r:Math.random() * 6, vr:(Math.random() - .5) * .3, c:cols[k % 5], s:5 + Math.random() * 5, life:1, d:.003});
    if (big) for (let n = 0; n < 6; n++) setTimeout(() => { if (state !== "over") return;
      const px = L.W * (.15 + Math.random() * .7), py = L.H * (.15 + Math.random() * .35);

      $("bfoot").innerHTML = B.tw ? twFoot(fs) : fs === "r" ? '<button class="b s" id="ast">撤退する</button>'
        : fs === "w" ? '<div class="pt">VICTORY</div><div class="dim" style="font-size:14px;color:#f5ff3b">撃破 ' + B.kills + '　+' + B.rw + ' PT' + (B.first ? "（初クリアボーナス込み）" : "") + chNote(STAGES[B.n - 1]) + msTxt(B.ms) + '</div><button class="b" id="ast">ステージ選択へ</button>'
        : '<div class="pt" style="color:#ff3b5c;text-shadow:0 0 12px #ff3b5c">DEFEAT</div><button class="b" id="retry">もう一度挑戦</button><button class="b s" id="apt">編成を変える</button><button class="b s" id="ast">ステージ選択へ</button>'; }
  }

  // イベントバトル：判定成功ごとにパーティの攻撃力でボスにダメージ
  function startEvent(n){
    const st = STAGES[n - 1];
    stopBattle(); menuBgm(false);
    setLevel(st.ev); notes = []; layout();
    EV = {n}; hm.hidden = true; begin();
  }
  function evFinish(win){
    const est = STAGES[EV.n - 1], first = win && est.s > S.cl[est.c - 1], rw = win ? Math.round((first ? 1000 : 300) * ru(EV.n)) : 0;
    let mr = null;
    if (win){ if (first) S.cl[est.c - 1] = est.s; mr = awardMs(EV.n, [cnt.m === 0, cnt.p / Math.max(1, cnt.p + cnt.g) >= .8]); S.pt += rw; save(); }
    title.textContent = win ? "VICTORY" : "DEFEAT"; title.className = win ? "tcl" : "";
    sub.innerHTML = "HIT " + score + " / " + GOAL + "<br>PERFECT " + cnt.p + " ・ GOOD " + cnt.g + " ・ MISS " + cnt.m + "<br>MAX COMBO " + maxCombo +
      (win ? '<br><b style="color:#f5ff3b;font-size:20px">+' + rw + ' PT</b>' + (first ? "（初クリアボーナス込み）" : "") + chNote(est) + msTxt(mr) : "<br>もう一度挑戦しよう");
    startBtn.textContent = "RETRY"; lvBox.hidden = true; $("toHome").textContent = "ステージ選択へ"; ov.hidden = false;
    if (win){ ov.style.background = "rgba(4,6,14,.5)"; celebrate(false); sfxClear(); } else sfxLose();
  }

  function advClick(e){
    const ta = e.target.closest("[data-a]");
    if (ta){ const i = +ta.dataset.a, k = S.party.indexOf(i); if (k >= 0) S.party.splice(k, 1); else if (S.party.length < 4) S.party.push(i); save(); sfxSel(); advParty(); return true; }
    const id = e.target.id;
    if (id === "badv"){ stopBattle(); S.party = S.party.filter(i => S.inv[i]); S.party.length < 4 ? advParty() : advChapters(); return true; }
    if (id === "ast"){ const tw = B && B.tw; stopBattle(); tw ? advTower() : advStage(); return true; }
    if (id === "btw"){ stopBattle(); advTower(); return true; }
    if (/^tws\d+$/.test(id)){ if (S.pt < TW_COST) return true; S.pt -= TW_COST; save(); startTower(+id.slice(3), null); return true; }
    if (id === "twn" && B && B.tw){ startTower(B.tw + 1, B.party); return true; }
    if (id === "bac"){ advAch(); return true; }
    if (id === "acall"){ claimAch(null); advAch(true); return true; }
    if (id.indexOf("ac_") === 0){ claimAch(id.slice(3)); advAch(true); return true; }
    if (id === "achs"){ advChapters(); return true; }
    if (/^cb\d$/.test(id)){ claimCh(+id[2]); return true; }
    if (/^ch\d$/.test(id)){ CUR_CH = +id[2]; advStage(); return true; }
    if (id === "apt"){ stopBattle(); advParty(); return true; }
    if (/^st\d+$/.test(id)){ const n = +id.slice(2); const st = STAGES[n - 1]; if (st.s <= S.cl[st.c - 1] + 1) st.ev ? startEvent(n) : startBattle(n); return true; }
    if (id === "retry"){ startBattle(B.n); return true; }
    return false;
  }

  // ===== ミッション／実績／無限の塔 =====
  const msDesc = st => st.ev ? ["ノーミスでクリア", "PERFECT率80%以上でクリア"] : ["全員生存でクリア", "残りHP50%以上でクリア"];
  function awardMs(n, conds){   // 各ステージ2つのミッション。初めて達成した時だけPT獲得
    const d = msDesc(STAGES[n - 1]), r = {got:0, names:[]};
    conds.forEach((ok, i) => { if (ok && !(S.ms[n - 1] & (1 << i))){ S.ms[n - 1] |= 1 << i; r.got += Math.round(200 * ru(n)); r.names.push(d[i]); } });
    S.pt += r.got; return r;
  }
  const msTxt = r => r && r.names.length ? '<br>🎯 ミッション達成：' + r.names.join(" ／ ") + '　+' + r.got + ' PT' : "";
  const msLine = idx => { const m = S.ms[idx], d = msDesc(STAGES[idx]); return '<br><span class="dim" style="color:#f5ff3b">🎯 ' + (m & 1 ? "★" : "☆") + d[0] + ' ／ ' + (m & 2 ? "★" : "☆") + d[1] + '</span>'; };
  const msCount = () => S.ms.reduce((a, v) => a + (v & 1) + ((v >> 1) & 1), 0);

  const rarN = r => () => CH.filter((c, i) => c[1] === r && S.inv[i]).length;
  const rarAll = r => CH.filter(c => c[1] === r).length;
  const ACH = [   // [id, 名前, 説明, 現在値, 目標, 報酬PT]
    ["fc1", "フルコンボ初達成", "音ゲーでフルコンボを達成", () => S.st.fc, 1, 500],
    ["fc10", "フルコンボ職人", "フルコンボを10回達成", () => S.st.fc, 10, 3000],
    ["fc30", "フルコンボマスター", "フルコンボを30回達成", () => S.st.fc, 30, 10000],
    ["ok10", "リズム入門", "音ゲーを10回クリア", () => S.st.ok, 10, 500],
    ["ok50", "リズムの達人", "音ゲーを50回クリア", () => S.st.ok, 50, 3000],
    ["mc100", "100コンボ", "1回のプレイで100コンボ", () => S.st.mc, 100, 1000],
    ["mc300", "300コンボ", "1回のプレイで300コンボ", () => S.st.mc, 300, 5000],
    ["g10", "ガチャ初心者", "ガチャを累計10回引く", () => S.st.g, 10, 300],
    ["g100", "ガチャ常連", "ガチャを累計100回引く", () => S.st.g, 100, 2000],
    ["g500", "ガチャ達人", "ガチャを累計500回引く", () => S.st.g, 500, 10000],
    ["col20", "コレクター", "20種類を集める", () => Object.keys(S.inv).length, 20, 1000],
    ["col40", "大コレクター", "40種類を集める", () => Object.keys(S.inv).length, 40, 3000],
    ["colall", "コンプリート", "全種類を集める", () => Object.keys(S.inv).length, CH.length, 20000],
    ["ssr", "SSRコンプ", "SSRを全種類集める", rarN("SSR"), rarAll("SSR"), 5000],
    ["ul", "伝説の到来", "ULを手に入れる", rarN("UL"), 1, 10000],
    ["mx1", "限界突破", "最大まで強化したキャラが1体", () => CH.filter((c, i) => S.inv[i] && lvOf(i) >= maxE(i)).length, 1, 3000],
    ["mx10", "育成の鬼", "最大まで強化したキャラが10体", () => CH.filter((c, i) => S.inv[i] && lvOf(i) >= maxE(i)).length, 10, 10000],
    ["ch1", "冒険の始まり", "章を1つ制覇（STAGE10クリア）", () => S.cl.filter(v => v >= 10).length, 1, 1000],
    ["ch5", "半分制覇", "章を5つ制覇", () => S.cl.filter(v => v >= 10).length, 5, 5000],
    ["ch10", "全章制覇", "章を10すべて制覇", () => S.cl.filter(v => v >= 10).length, NCH, 20000],
    ["ms20", "ミッション見習い", "ミッションを20個達成", msCount, 20, 2000],
    ["ms100", "ミッション上級者", "ミッションを100個達成", msCount, 100, 8000],
    ["ms200", "ミッション完全制覇", "ミッションを全200個達成", msCount, NST * 2, 20000],
    ["tw10", "塔の挑戦者", "無限の塔で10階に到達", () => S.tw, 10, 2000],
    ["tw30", "塔の踏破者", "無限の塔で30階に到達", () => S.tw, 30, 5000],
    ["tw50", "塔の覇者", "無限の塔で50階に到達", () => S.tw, 50, 10000],
    ["tw100", "天を衝く者", "無限の塔で100階に到達", () => S.tw, 100, 30000],
  ];
  const normAc = o => { const r = {}; ACH.forEach(a => { if (o && o[a[0]]) r[a[0]] = 1; }); return r; };
  const achList = () => ACH.map(a => { const cur = a[3](), done = cur >= a[4]; return {id:a[0], name:a[1], desc:a[2], cur:Math.min(cur, a[4]), goal:a[4], pt:a[5], done, got:!!S.ac[a[0]]}; });
  const achReady = () => achList().filter(a => a.done && !a.got);
  function claimAch(id){
    const L = achReady().filter(a => !id || a.id === id); let t = 0;
    L.forEach(a => { S.ac[a.id] = 1; t += a.pt; });
    if (t){ S.pt += t; save(); sfxLv(true); }
  }
  function advAch(keep){
    menuBgm(true); battleBgm(false);
    const L = achList(), rd = L.filter(a => a.done && !a.got), tot = rd.reduce((a, x) => a + x.pt, 0), got = L.filter(a => a.got).length;
    const rank = a => a.done && !a.got ? 0 : a.got ? 2 : 1;
    const sorted = L.map((a, k) => [a, k]).sort((p, q) => rank(p[0]) - rank(q[0]) || p[1] - q[1]).map(p => p[0]);
    aView('<div id="t2" style="font-size:26px">ACHIEVEMENTS</div><div class="pt">' + S.pt + ' PT</div><div class="dim">達成 ' + got + ' / ' + L.length + '　ミッション ' + msCount() + ' / ' + NST * 2 + '</div>' +
      '<button class="b"' + (rd.length ? "" : " disabled") + ' id="acall">' + (rd.length ? "まとめて受け取る（" + rd.length + "件 +" + tot + " PT）" : "受け取れる実績はありません") + '</button>' +
      sorted.map(a => '<div class="ac' + (a.got ? " g" : a.done ? " d" : "") + '"><b>' + a.name + (a.got ? " ✔" : "") + '</b>　<span class="dim">+' + a.pt + ' PT</span><br>' + a.desc +
        '<div class="hb"><i style="width:' + a.cur / a.goal * 100 + '%;background:' + (a.done ? "#f5ff3b" : "#00f0ff") + '"></i></div><span class="dim">' + a.cur + ' / ' + a.goal + '</span>' +
        (a.done && !a.got ? '<br><button class="b s" id="ac_' + a.id + '" style="margin-top:6px">受け取る</button>' : "") + '</div>').join("") +
      '<button class="b s" id="bk">← HOME</button>', keep);
  }
  function advTower(){
    menuBgm(true); battleBgm(false);
    S.party = S.party.filter(i => S.inv[i]); if (S.party.length < 4) return advParty();
    const starts = [1]; for (let f = 10; f <= S.tw + 1; f += 10) starts.push(f);
    aView('<div id="t2" style="font-size:24px">♾ 無限の塔</div><div class="dim">上るほど敵が強くなります。HPは次の階へ持ち越し（生存者は30%回復）、全滅で終了。10階ごとにボス。初到達の階は報酬3倍。</div><div class="pt">最高 ' + S.tw + ' F</div>' +
      starts.map(f => '<button class="b" id="tws' + f + '"' + (S.pt < TW_COST ? " disabled" : "") + '>' + f + 'F から挑戦（' + TW_COST + ' PT）</button>').join("") +
      '<div class="dim" style="color:#f5ff3b">入場コスト ' + TW_COST + ' PT（所持 ' + S.pt + ' PT）' + (S.pt < TW_COST ? "　PTが足りません" : "") + '。次の階へ進む間は不要です</div>' +
      '<div class="dim">10階ごとの開始位置は、その手前の階まで到達すると解放されます</div><button class="b s" id="achs">章を選ぶ</button><button class="b s" id="apt">編成を変える</button><button class="b s" id="bk">← HOME</button>');
  }
  function twFoot(fs){
    if (fs === "r") return '<button class="b s" id="ast">撤退する</button>';
    if (fs === "w") return '<div class="pt">CLEAR</div><div class="dim" style="font-size:14px;color:#f5ff3b">' + B.tw + 'F 突破　+' + B.rw + ' PT' + (B.first ? "（初到達ボーナス込み）" : "") + '</div><button class="b" id="twn">次の階へ（' + (B.tw + 1) + 'F）</button><button class="b s" id="btw">撤退して塔の入口へ</button>';
    return '<div class="pt" style="color:#ff3b5c;text-shadow:0 0 12px #ff3b5c">DEFEAT</div><div class="dim" style="font-size:14px;color:#f5ff3b">' + B.tw + 'F で全滅　最高到達 ' + S.tw + 'F</div><button class="b" id="btw">塔の入口へ</button><button class="b s" id="apt">編成を変える</button>';
  }

  // ===== ホームに追加／共有 =====
  let DP = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); DP = e; });
  window.addEventListener("appinstalled", () => { DP = null; if (!hm.hidden && hm.classList.contains("bg")) show("menu"); });
  function isStandalone(){ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
  function msgBox(html){
    zm.innerHTML = '<div class="zw"><div class="warn" style="text-align:left;color:#d8f6ff;border-color:#00f0ff">' + html + '</div><button class="b s" id="zx">閉じる</button></div>';
    zm.hidden = false;
  }
  async function addHome(){
    if (DP){ const p = DP; DP = null; try { p.prompt(); await p.userChoice; } catch(e){} return; }
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    msgBox((ios ? "Safariの共有ボタン（□に↑のマーク）を押して、「ホーム画面に追加」を選んでください。<br>※Chromeなど他のブラウザの場合は、Safariでこのページを開いてください。"
                : "ブラウザのメニュー（︙）から「ホーム画面に追加」または「アプリをインストール」を選んでください。") +
      (location.protocol === "file:" ? "<br><br>※ファイルを直接開いている状態では追加できません。公開したURL（https）で開いてください。" : ""));
  }
  async function shareApp(){
    const url = location.href.split("#")[0], text = "音ゲー×ガチャ「OVERCLOCKED」で遊ぼう！" + (S.best ? "ベストHIT " + S.best + "！" : "");
    try { if (navigator.share){ await navigator.share({title:"OVERCLOCKED", text, url}); return; } } catch(e){ if (e && e.name === "AbortError") return; }
    let ok = false; try { await navigator.clipboard.writeText(text + " " + url); ok = true; } catch(e){}
    msgBox(ok ? "共有メッセージとリンクをコピーしました。<br>SNSやメッセージアプリに貼り付けてください。" : "この環境では共有できません。次のURLをコピーして送ってください。<br><br>" + url);
  }
  show("menu");
  frame();
})();
</script>
</body>
</html>
